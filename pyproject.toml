[project]
name = "cs2-plugins"
version = "1.0.0"
description = "CS2 plugin monorepo build tools"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
    "voltmod @ git+https://github.com/VoltyGames/voltmod.git@main",
    "ruff>=0.14.0",
    "poethepoet>=0.47.0",
]

# CI installs only this group to package and deploy: uv run --only-group deploy
[dependency-groups]
deploy = [
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0",
    "typer>=0.27.1",
]

[tool.uv]
package = false
default-groups = ["deploy"]

[tool.poe.tasks]
build = "voltmod build"
build-linux = "voltmod build -p linux-steamrt-release"
test = "voltmod test"
bootstrap = "voltmod bootstrap"
doctor = "voltmod doctor"
new-plugin = "voltmod new plugin"
install = "voltmod install"
serve = "voltmod serve"
run = "voltmod run"
panorama = "voltmod panorama compile"
format = "voltmod format plugins contracts"
deploy = "python -m deploy.cli"
rcon = "python -m deploy.cli rcon"
schema = "voltmod database header"

[tool.poe.tasks.meatgg-addon]
help = "Build the meatgg workshop addon: every screen, Stronghold's content and the rank icons"
cmd = "python -m workshop.build_meatgg"

[tool.poe.tasks.lint]
help = "Lint the build tooling and check the plugin source conventions"
sequence = [{ ref = "lint-ci" }, { ref = "schema --check" }]

[tool.poe.tasks.lint-ci]
help = "Lint checks that run without Conan packages"
sequence = [
    { cmd = "ruff check ." },
    { cmd = "voltmod lint" },
    { cmd = "voltmod panorama check" },
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["voltmod", "references"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
exclude = ["^voltmod/", "^references/"]
mypy_path = "voltmod/cli"

[[tool.mypy.overrides]]
module = ["conan.*", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest"]
ignore_missing_imports = true
