// Deathmatch rules, run by the plugin on load and on every map start, after Valve's gamemode cfg.
// One command per line; the plugin skips blank lines and // comments.

// Free-for-all. Set both to 0 for team deathmatch.
mp_teammates_are_enemies 1
mp_solid_teammates 1

// Match length in minutes: the round clock on the HUD. The time limit ends the match when that round ends.
mp_roundtime 10
mp_timelimit 10

// Ghost time after a spawn, in seconds: no damage taken, buying allowed. Firing ends it early.
mp_respawn_immunitytime 10

// Random spawns away from live players and out of their sight.
mp_randomspawn 1
mp_randomspawn_los 1
mp_randomspawn_dist 1

// No bonus weapon rounds and no bonus points: the scoreboard's kills are what count.
mp_dm_time_between_bonus_min 99999
mp_dm_time_between_bonus_max 99999
mp_dm_bonus_percent 0
