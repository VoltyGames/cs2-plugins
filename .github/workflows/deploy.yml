# Secrets:
#   PRIVATE_PLUGINS_PAT  repository; a token that can read the closed-source plugin repos
#   SERVER_ENV           each server environment; the whole deploy/secrets/<id>/.env file
#   SSH_KEY              each Docker host environment; the private deploy key

name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      server:
        description: "Deploy only this server id (blank = every enabled server)"
        required: false
        default: ""
      dry_run:
        description: "Show what would change without changing servers"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}

jobs:
  targets:
    name: Resolve deploy targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      servers: ${{ steps.resolve.outputs.servers }}
      docker: ${{ steps.resolve.outputs.docker }}
      runtime_image: ${{ steps.resolve.outputs.runtime_image }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Resolve the servers and runtime image
        id: resolve
        env:
          SERVER: ${{ inputs.server }}
        run: |
          plan=$(uv run --locked --only-group deploy python -m deploy.cli ci-matrix ${SERVER:+--server "$SERVER"})
          echo "$plan" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build and package plugins
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the closed-source plugins
        env:
          PRIVATE_PLUGINS_PAT: ${{ secrets.PRIVATE_PLUGINS_PAT }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://x-access-token:${PRIVATE_PLUGINS_PAT}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --checkout plugins/anticheat plugins/stronghold

      # Toolchain only, so it tracks main: conan.lock decides which framework the plugins link.
      - uses: VoltyGames/voltmod/.github/actions/setup-toolchain@main

      - name: Build
        run: voltmod build -p linux-steamrt-release

      - name: Test
        run: voltmod test -p linux-steamrt-release

      - name: Package plugins
        run: uv run --locked --only-group deploy python -m deploy.cli package

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: build/package/
          if-no-files-found: error

  runtime-image:
    name: Build and publish the runtime image
    needs: targets
    if: needs.targets.outputs.docker == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: deploy/files/docker
          push: true
          tags: |
            ${{ needs.targets.outputs.runtime_image }}:${{ github.sha }}
            ${{ needs.targets.outputs.runtime_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ matrix.server.id }}
    needs: [targets, build, runtime-image]
    # Also runs when the image job was skipped: no Docker host, or a dry run.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && needs.runtime-image.result != 'failure'
      && needs.targets.outputs.servers != '[]' }}
    runs-on: ubuntu-latest
    # A Docker host's first start downloads the whole game.
    timeout-minutes: 120
    environment: ${{ matrix.server.environment }}
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.targets.outputs.servers) }}
    steps:
      - uses: actions/checkout@v7

      # Deploy copies every deployed plugin's configs/ from the source tree.
      - name: Check out the closed-source plugins
        env:
          PRIVATE_PLUGINS_PAT: ${{ secrets.PRIVATE_PLUGINS_PAT }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://x-access-token:${PRIVATE_PLUGINS_PAT}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --checkout plugins/anticheat plugins/stronghold

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: build/package

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Write secrets
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          ENV_FILE: deploy/secrets/${{ matrix.server.id }}/.env
        run: |
          if [ -z "$SERVER_ENV" ]; then
            echo "ERROR: the ${{ matrix.server.environment }} environment has no SERVER_ENV secret" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$ENV_FILE")"
          printf '%s\n' "$SERVER_ENV" > "$ENV_FILE"
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/id_deploy"
            chmod 600 "$RUNNER_TEMP/id_deploy"
          fi

      - name: Deploy
        env:
          SSH_KEY_FILE: ${{ runner.temp }}/id_deploy
          RUNTIME_IMAGE_TAG: ${{ github.sha }}
        run: >-
          uv run --locked --only-group deploy python -m deploy.cli push
          --server "${{ matrix.server.id }}" ${{ inputs.dry_run && '--dry-run' || '' }}
