# Secrets:
#   PRIVATE_PLUGINS_PAT  optional; a token that can read the closed-source plugin repos

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      PRIVATE_PLUGINS_PAT: ${{ secrets.PRIVATE_PLUGINS_PAT }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the closed-source plugins
        if: env.PRIVATE_PLUGINS_PAT != ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://x-access-token:${PRIVATE_PLUGINS_PAT}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --checkout plugins/anticheat plugins/stronghold

      - uses: VoltyGames/voltmod/.github/actions/setup-toolchain@main

      - name: Build
        run: voltmod build -p linux-steamrt-release

      - name: Test
        run: voltmod test -p linux-steamrt-release

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv run poe lint-ci
